# Free demo service: runtime data is ephemeral; do not use for durable user records.
services:
  - type: web
    name: smart-career-matchmaker
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FORWARDED_ALLOW_IPS
        value: '*'
      - key: JOBS_API_URL
        sync: false
      - key: JOBS_API_KEY
        sync: false
      - key: JOBS_API_SEARCH_MODE
        value: fields
